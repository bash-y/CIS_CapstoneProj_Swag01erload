<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Project Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f7fb; --bg-grad1: #eef1f8; --bg-grad2: #f6f7fb;
      --bg-elev: #eceef4; --bg-card: #ffffff; --fg: #141821; --fg-mute: #5b616e;
      --border: #e2e5ec; --border-strong: #cfd4de;
      --accent: #4f46e5; --accent2: #06b6d4; --accent-soft: #eef0fe; --link: #4338ca;
      --green: #0f8a53; --amber: #9a6400; --red: #c02a30;
      --green-bg: #e5f6ec; --amber-bg: #fcf2da; --red-bg: #fce7e7;
      --hm0: #e7e9f0; --hm1: #c3e3d2; --hm2: #85cba6; --hm3: #3fab74; --hm4: #0f8a53;
      --ring-track: #e7e9f0;
      --shadow: 0 1px 2px rgba(20,24,33,.04), 0 6px 20px rgba(20,24,33,.06);
      --shadow-lg: 0 2px 4px rgba(20,24,33,.05), 0 16px 40px rgba(20,24,33,.10);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0c0e14; --bg-grad1: #12151f; --bg-grad2: #0c0e14;
        --bg-elev: #1a1e29; --bg-card: #151925; --fg: #e9ecf3; --fg-mute: #9aa2b2;
        --border: #262c3a; --border-strong: #333a4b;
        --accent: #818cf8; --accent2: #22d3ee; --accent-soft: #1b2030; --link: #a5b4fc;
        --green: #34d399; --amber: #fbbf24; --red: #f87171;
        --green-bg: #0f2c22; --amber-bg: #342a10; --red-bg: #361a1c;
        --hm0: #1c2230; --hm1: #16402f; --hm2: #1f6b49; --hm3: #2f9566; --hm4: #34d399;
        --ring-track: #222838;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
        --shadow-lg: 0 2px 6px rgba(0,0,0,.4), 0 20px 50px rgba(0,0,0,.5);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0c0e14; --bg-grad1: #12151f; --bg-grad2: #0c0e14;
      --bg-elev: #1a1e29; --bg-card: #151925; --fg: #e9ecf3; --fg-mute: #9aa2b2;
      --border: #262c3a; --border-strong: #333a4b;
      --accent: #818cf8; --accent2: #22d3ee; --accent-soft: #1b2030; --link: #a5b4fc;
      --green: #34d399; --amber: #fbbf24; --red: #f87171;
      --green-bg: #0f2c22; --amber-bg: #342a10; --red-bg: #361a1c;
      --hm0: #1c2230; --hm1: #16402f; --hm2: #1f6b49; --hm3: #2f9566; --hm4: #34d399;
      --ring-track: #222838;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      --shadow-lg: 0 2px 6px rgba(0,0,0,.4), 0 20px 50px rgba(0,0,0,.5);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--fg);
           background: radial-gradient(1200px 600px at 100% -10%, var(--bg-grad1), transparent 60%), var(--bg-grad2);
           background-attachment: fixed;
           font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
           font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 64px; }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    h1 { font-size: 34px; margin: 0 0 4px; line-height: 1.15; letter-spacing: -0.02em; font-weight: 800; }
    h2 { font-size: 15px; margin: 52px 0 16px; text-transform: uppercase; letter-spacing: .08em;
         color: var(--fg-mute); font-weight: 700; display: flex; align-items: center; gap: 10px; }
    h2::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    h3 { font-size: 17px; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; }
    code, .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: .9em; }
    .lede { color: var(--fg-mute); margin: 0 0 14px; max-width: 80ch; }
    /* ---- Hero ---- */
    .hero { position: relative; overflow: hidden; border-radius: 20px; padding: 30px 32px;
            background: linear-gradient(135deg, var(--accent) 0%, #6d28d9 55%, var(--accent2) 130%);
            color: #fff; box-shadow: var(--shadow-lg); margin-bottom: 14px;
            display: flex; justify-content: space-between; gap: 28px; flex-wrap: wrap; align-items: center; }
    .hero::before { content: ""; position: absolute; inset: 0;
            background: radial-gradient(600px 300px at 90% -30%, rgba(255,255,255,.25), transparent 60%);
            pointer-events: none; }
    .hero > div { position: relative; }
    .hero h1 { color: #fff; }
    .hero .meta { color: rgba(255,255,255,.85); font-size: 15px; font-weight: 500; }
    .hero .meta a { color: #fff; text-decoration: underline; text-underline-offset: 2px; }
    .hero .lede { color: rgba(255,255,255,.9); max-width: 62ch; margin-top: 10px; }
    .hero-right { position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .ring-wrap { display: flex; flex-direction: column; align-items: center; }
    .ring-cap { font-size: 13px; color: rgba(255,255,255,.85); margin-top: 2px; font-weight: 600;
                text-transform: uppercase; letter-spacing: .06em; }
    .btn { display: inline-block; background: #fff; color: var(--accent); border: 0; border-radius: 10px;
           padding: 10px 18px; font-weight: 700; font-size: 15px; cursor: pointer; box-shadow: var(--shadow);
           transition: transform .1s ease; }
    .btn:hover { transform: translateY(-1px); text-decoration: none; }
    .hero .small { color: rgba(255,255,255,.8); }
    .hero .small a { color: #fff; }
    .mini-btn { background: var(--bg-card); color: var(--fg); border: 1px solid var(--border-strong);
                border-radius: 8px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .mini-btn:hover { border-color: var(--accent); color: var(--accent); }
    .banner { border: 1px solid var(--amber); background: var(--amber-bg); color: var(--fg);
              border-radius: 12px; padding: 12px 16px; margin: 14px 0 0; box-shadow: var(--shadow); }
    .banner strong { color: var(--amber); }
    /* ---- Stat tiles ---- */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 14px; margin-top: 22px; }
    .stat { position: relative; background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
            padding: 16px 18px; box-shadow: var(--shadow); overflow: hidden;
            transition: transform .12s ease, box-shadow .12s ease; }
    .stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: linear-gradient(var(--accent), var(--accent2)); }
    .stat .label { font-size: 13px; color: var(--fg-mute); font-weight: 600; letter-spacing: .01em; }
    .stat .value { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
    .stat .sub { font-size: 12.5px; color: var(--fg-mute); }
    /* ---- Cards ---- */
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px;
            box-shadow: var(--shadow); transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
    .card:hover { box-shadow: var(--shadow-lg); border-color: var(--border-strong); }
    .muted { color: var(--fg-mute); }
    .small { font-size: 14px; }
    .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 500;
            background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; white-space: nowrap; }
    .chip.plain { background: var(--bg-elev); color: var(--fg-mute); }
    .bar { height: 9px; background: var(--ring-track); border-radius: 999px; overflow: hidden; margin: 10px 0; }
    .bar > span { display: block; height: 100%; border-radius: 999px;
                  background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .6s cubic-bezier(.2,.8,.2,1); }
    .bar.g > span { background: linear-gradient(90deg, #0f8a53, #34d399); }
    .table-wrap { overflow-x: auto; background: var(--bg-card); border: 1px solid var(--border);
                  border-radius: 14px; box-shadow: var(--shadow); }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    caption { text-align: left; color: var(--fg-mute); font-size: 13px; padding: 12px 16px 0; }
    th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr { transition: background .1s ease; }
    tbody tr:hover { background: var(--bg-elev); }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-mute);
         font-weight: 700; border-bottom: 1px solid var(--border-strong); }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .empty { color: var(--fg-mute); font-style: italic; }
    .status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .status.green { background: var(--green-bg); color: var(--green); }
    .status.amber { background: var(--amber-bg); color: var(--amber); }
    .status.red { background: var(--red-bg); color: var(--red); }
    tr.sev-green td:first-child { box-shadow: inset 4px 0 0 var(--green); }
    tr.sev-amber td:first-child { box-shadow: inset 4px 0 0 var(--amber); }
    tr.sev-red td:first-child { box-shadow: inset 4px 0 0 var(--red); }
    /* ---- Stack ---- */
    .stack { display: grid; gap: 12px; }
    .stack-row { display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-items: stretch; }
    .tier { font-weight: 700; text-transform: capitalize; padding-top: 18px; position: relative; }
    .tier::before { content: ""; position: absolute; left: -2px; top: 20px; width: 8px; height: 8px; border-radius: 50%;
                    background: linear-gradient(var(--accent), var(--accent2)); box-shadow: 0 0 0 4px var(--accent-soft); }
    .tier span.label { padding-left: 16px; display: block; }
    .tier .small { display: block; font-weight: 400; text-transform: none; color: var(--fg-mute); padding-left: 16px; }
    .layer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
    .layer-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
    .techs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .pr-links { margin-top: 10px; font-size: 14px; }
    .pr-links a { margin-right: 10px; }
    @media (max-width: 720px) { .stack-row { grid-template-columns: 1fr; gap: 4px; } .tier { padding-top: 4px; }
      .tier::before, .tier span.label, .tier .small { padding-left: 0; } .tier::before { display: none; } }
    /* ---- Milestones & stories ---- */
    .ms-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; }
    .ms-pct { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
    details.group { margin: 12px 0; }
    details.group > summary { font-weight: 700; cursor: pointer; padding: 8px 0; font-size: 15px; }
    details.story { border: 1px solid var(--border); border-radius: 12px; background: var(--bg-card);
                    padding: 12px 16px; margin: 10px 0; box-shadow: var(--shadow); }
    details.story[open] { border-color: var(--border-strong); }
    details.story > summary { cursor: pointer; font-size: 15px; }
    ul.subs { list-style: none; padding: 0; margin: 10px 0 0; }
    ul.subs li { padding: 4px 0 4px 26px; position: relative; }
    ul.subs li::before { content: "○"; position: absolute; left: 4px; color: var(--fg-mute); }
    ul.subs li.done::before { content: "✓"; color: var(--green); font-weight: 800; }
    ul.subs li.done { color: var(--fg-mute); text-decoration: line-through; }
    /* ---- Heatmap ---- */
    .hm { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
    .hm-col { display: flex; flex-direction: column; gap: 3px; }
    .hc { width: 14px; height: 14px; border-radius: 3px; background: var(--hm0); }
    .hc.l1 { background: var(--hm1); } .hc.l2 { background: var(--hm2); }
    .hc.l3 { background: var(--hm3); } .hc.l4 { background: var(--hm4); }
    .hc.pad { background: transparent; }
    .legend { display: flex; gap: 4px; align-items: center; font-size: 13px; color: var(--fg-mute); margin-top: 10px; }
    /* ---- Members ---- */
    .share { display: flex; height: 28px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); margin: 12px 0 6px; }
    .share span { display: block; height: 100%; }
    .key { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; margin-bottom: 16px; }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
    svg.spark rect { fill: var(--accent); }
    svg.spark line { stroke: var(--border); }
    footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--fg-mute); font-size: 14px; }
  </style>
</head>
<body>
<main id="app">
  <noscript><p>This dashboard needs JavaScript to draw its panels.</p></noscript>
  <p id="loading">Loading dashboard data...</p>
</main>

<!-- data.js is written by scripts/generate_dashboard.py; it sets window.DASHBOARD_DATA. -->
<script src="data.js"></script>
<script>
(function () {
  "use strict";
  const D = window.DASHBOARD_DATA;
  const app = document.getElementById("app");
  if (!D) {
    document.getElementById("loading").textContent =
      "No data.js found next to this page. Run: python3 scripts/generate_dashboard.py --demo";
    return;
  }

  // ---- tiny helpers -------------------------------------------------------------------------
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const link = (url, text) => `<a href="${esc(url)}">${esc(text)}</a>`;
  const fmtDate = iso => iso ? new Date(iso).toLocaleString(undefined,
    {year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "never";
  const pctBar = (pct, label, cls) =>
    `<div class="bar ${cls || ""}" role="img" aria-label="${esc(label)}: ${pct}% complete"><span style="width:${pct}%"></span></div>`;
  const ring = pct => {
    const r = 52, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
    return `<svg width="128" height="128" viewBox="0 0 130 130" role="img" aria-label="Overall complete: ${pct}%">
      <circle cx="65" cy="65" r="${r}" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="12"/>
      <circle cx="65" cy="65" r="${r}" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 65 65)"/>
      <text x="65" y="62" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">${pct}%</text>
      <text x="65" y="82" text-anchor="middle" font-size="11" letter-spacing="1" fill="rgba(255,255,255,.85)">COMPLETE</text>
    </svg>`;
  };
  const SEV = {green: "Ready", amber: "In progress", red: "Needs attention"};
  const REVIEW = {APPROVED: ["green", "Approved"], CHANGES_REQUESTED: ["red", "Changes requested"],
                  REVIEW_REQUIRED: ["amber", "Review needed"]};
  const layerName = id => {
    const l = D.layers.find(x => x.id === id);
    return l ? l.name : null;
  };
  const layerChip = id => id ? `<span class="chip">${esc(layerName(id) || id)}</span>`
                             : `<span class="chip" title="Add a layer: label">No layer</span>`;
  const section = (id, title, lede, body) =>
    `<section aria-labelledby="${id}"><h2 id="${id}">${esc(title)}</h2>` +
    (lede ? `<p class="lede">${lede}</p>` : "") + body + `</section>`;

  const html = [];
  const P = D.project, T = D.totals;

  // ---- header -------------------------------------------------------------------------------
  html.push(`<header class="hero">
    <div>
      <h1>${esc(P.name)}</h1>
      <div class="meta">${esc(P.team)}${P.course ? " · " + esc(P.course) : ""} · ${link(D.repo_url, D.repo)}</div>
      <p class="lede">${esc(P.description)}</p>
      <div style="margin-top:14px"><a class="btn" href="${esc(D.refresh_url)}">↻ Refresh now</a></div>
    </div>
    <div class="hero-right">
      <div class="ring-wrap">${ring(T.pct_complete)}</div>
      <div class="small">Last refresh: ${esc(fmtDate(D.generated_at))}</div>
      <div class="small"><a href="guide.html">How this dashboard works →</a></div>
    </div>
  </header>`);
  document.title = P.name + " dashboard";

  if (D.demo) {
    html.push(`<div class="banner" role="note"><strong>Sample data.</strong> Everything below is made up so you can
      see the layout. Run the refresh workflow, or <code>python3 scripts/generate_dashboard.py</code>,
      to replace it with your repository's real issues, pull requests and commits.</div>`);
  }
  (D.warnings || []).forEach(w => html.push(`<div class="banner" role="note"><strong>Note.</strong> ${esc(w)}</div>`));

  // ---- summary numbers ----------------------------------------------------------------------
  const stat = (label, value, tone, sub) =>
    `<div class="stat"><div class="label">${label}</div>` +
    `<div class="value"${tone ? ` style="color:var(--${tone})"` : ""}>${value}</div>` +
    (sub ? `<div class="sub">${sub}</div>` : "") + `</div>`;
  html.push(`<section aria-label="Summary"><div class="stats">
    ${stat("Overall complete", T.pct_complete + "%", "green", (T.issues_closed != null ? `${T.issues_closed} of ${T.issues_total} issues closed` : ""))}
    ${stat("Story tasks done", (T.story_pct != null ? T.story_pct + "%" : "—"), "", (T.story_tasks != null ? `${T.story_tasks_done} of ${T.story_tasks} subtasks` : ""))}
    ${stat("Open pull requests", T.open_prs, "", `${T.ready_prs} ready · ${T.attention_prs} need attention`)}
    ${stat("Need attention", T.attention_prs, T.attention_prs ? "red" : "")}
    ${stat("Open stories", T.open_stories)}
    ${stat("Open issues", T.open_issues)}
    ${stat("Failed runs (72h)", T.failures_72h, T.failures_72h ? "red" : "green")}
    ${stat("Commits (90 days)", T.commits_90d)}
  </div></section>`);

  // ---- the stack ----------------------------------------------------------------------------
  const tiers = Object.keys(D.stack_tiers);
  const rows = tiers.filter(t => D.layers.some(l => l.stack_tier === t)).map(t => {
    const cards = D.layers.filter(l => l.stack_tier === t).map(l => {
      const total = l.open_issues + l.closed_issues;
      const prs = l.open_prs.length
        ? `<div class="pr-links">Open PRs: ${l.open_prs.map(p =>
            `${link(p.url, "#" + p.number)} <span class="status ${p.severity}">${SEV[p.severity]}</span>`).join(" ")}</div>` : "";
      return `<div class="card">
        <div class="layer-head"><h3>${esc(l.name)}</h3>
          <span class="small muted">${total ? `${l.pct}% · ${l.closed_issues}/${total}` : "not tracked"}</span></div>
        <div class="small muted">${esc(l.description)}</div>
        ${pctBar(l.pct, l.name, "g")}
        <div class="techs">${l.technologies.map(x => `<span class="chip plain">${esc(x)}</span>`).join("")}
          <span class="chip">layer:${esc(l.id)}</span></div>
        ${prs}
      </div>`;
    }).join("");
    return `<div class="stack-row"><div class="tier"><span class="label">${esc(t)}</span><span class="small">${esc(D.stack_tiers[t])}</span></div>
      <div class="layer-grid">${cards}</div></div>`;
  }).join("");
  const un = D.unassigned;
  const unNote = (un.open_issues || un.open_prs)
    ? `<p class="banner" role="note"><strong>Unassigned work.</strong> ${un.open_issues} open issue(s) and
       ${un.open_prs} open pull request(s) have no <code>layer:</code> label, so they do not count toward any layer.</p>` : "";
  html.push(section("stack", "Your stack", "Each layer the team defined in <code>dashboard.config.json</code>, " +
    "placed on the stack tier it belongs to, top of the stack first. Progress is closed issues over all issues " +
    "carrying that layer's label.", unNote + `<div class="stack">${rows}</div>`));

  // ---- pull requests ------------------------------------------------------------------------
  const prRows = D.open_prs.map(p => {
    const [rTone, rText] = REVIEW[p.review] || ["amber", p.review];
    const c = p.checks;
    const checks = c.runs.length ? `${c.passed} passed, ${c.failed} failed, ${c.pending} running` : "No checks ran";
    return `<tr class="sev-${p.severity}">
      <td><span class="status ${p.severity}">${SEV[p.severity]}</span>${p.draft ? ' <span class="chip">Draft</span>' : ""}</td>
      <td>${link(p.url, "#" + p.number)}</td><td>${esc(p.title)}<div class="small muted">by ${esc(p.author)}</div></td>
      <td>${layerChip(p.layer)}</td><td class="small" title="${esc(c.runs.map(r => r.name + ": " + r.state).join(", "))}">${checks}</td>
      <td><span class="status ${rTone}">${rText}</span></td>
      <td class="num small">+${p.additions} / -${p.deletions}</td></tr>`;
  }).join("");
  html.push(section("prs", "Open pull requests", "Ready means approved with every check passed. " +
    "Needs attention means a check failed or a reviewer asked for changes.",
    `<div class="table-wrap"><table><caption>Open pull requests with build tests and review state</caption>
     <thead><tr><th scope="col">Status</th><th scope="col">PR</th><th scope="col">Title</th><th scope="col">Layer</th>
     <th scope="col">Build tests</th><th scope="col">Review</th><th scope="col" class="num">Lines</th></tr></thead>
     <tbody>${prRows || '<tr><td colspan="7" class="empty">No open pull requests.</td></tr>'}</tbody></table></div>`));

  // ---- milestones ---------------------------------------------------------------------------
  const ms = D.milestones.map(m => `<div class="card">
      <div class="layer-head"><h3>${link(m.url, m.title)}</h3>
        <span class="ms-pct" style="color:var(--${m.pct >= 100 ? "green" : "accent"})">${m.pct}%</span></div>
      ${pctBar(m.pct, m.title, "g")}
      <div class="small muted">${m.closed}/${m.total} issues closed · ${m.open} open
      ${m.state === "closed" ? ' <span class="status green">Closed</span>' : ""}</div>
      <div class="small muted" style="margin-top:6px">${esc(m.description)}${m.due_on ? " Due " + esc(new Date(m.due_on).toLocaleDateString()) + "." : ""}</div></div>`).join("");
  html.push(section("milestones", "Milestones", "One milestone per sprint or deliverable. Progress is closed issues over all issues in it.",
    ms ? `<div class="ms-grid">${ms}</div>` : '<p class="empty">No milestones yet. Create one under Issues, Milestones.</p>'));

  // ---- stories ------------------------------------------------------------------------------
  const storyHtml = s => `<details class="story"><summary><strong>${esc("#" + s.number + " " + s.title)}</strong>
      <span class="small muted"> · ${s.sub_closed}/${s.sub_total} subtasks${s.sub_total ? " · " + s.pct + "%" : ""}</span></summary>
      ${s.sub_total ? pctBar(s.pct, "Story " + s.number, "g") : ""}
      <div class="small" style="margin-top:6px">${s.layer ? layerChip(s.layer) + " " : ""}${s.priority ? `<span class="chip">${esc(s.priority)}</span> ` : ""}
        ${s.assignees.length ? "Assigned to " + esc(s.assignees.join(", ")) : '<span class="muted">Unassigned</span>'}
        · ${link(s.url, "Open on GitHub ↗")}</div>
      ${s.subs.length ? `<ul class="subs">${s.subs.map(x => `<li class="${x.done ? "done" : ""}">${
          x.url ? link(x.url, "#" + x.number + " " + x.title) : esc(x.title)}</li>`).join("")}</ul>`
        : '<p class="small empty">No subtasks listed in this issue.</p>'}
    </details>`;
  const groups = {};
  D.stories.forEach(s => (groups[s.milestone || "No milestone"] ||= []).push(s));
  const storyGroups = Object.keys(groups).map(g => `<details class="group" open><summary>${esc(g)}
      <span class="small muted">(${groups[g].length} open)</span></summary>${groups[g].map(storyHtml).join("")}</details>`).join("");
  html.push(section("stories", "Open stories by milestone",
    "User stories (labeled <code>user-story</code>), grouped by milestone. Progress is the completed subtasks in each issue's task list.",
    storyGroups ? `<p><button type="button" class="mini-btn" data-toggle="stories-box" data-open="1">Expand all</button>
      <button type="button" class="mini-btn" data-toggle="stories-box" data-open="0">Collapse all</button></p>
      <div id="stories-box">${storyGroups}</div>` : '<p class="empty">No open stories.</p>'));

  // ---- other open issues --------------------------------------------------------------------
  const issueRows = D.open_issues.map(i => `<tr><td>${link(i.url, "#" + i.number)}</td><td>${esc(i.title)}</td>
      <td>${layerChip(i.layer)}</td><td>${esc(i.priority) || '<span class="muted">none</span>'}</td>
      <td>${esc(i.milestone) || '<span class="muted">none</span>'}</td>
      <td>${esc(i.assignees.join(", ")) || '<span class="muted">nobody</span>'}</td></tr>`).join("");
  html.push(section("issues", "Other open issues", "Tasks and bugs that are not stories.",
    `<div class="table-wrap"><table><caption>Open issues that are not stories</caption>
     <thead><tr><th scope="col">Issue</th><th scope="col">Title</th><th scope="col">Layer</th><th scope="col">Priority</th>
     <th scope="col">Milestone</th><th scope="col">Assigned</th></tr></thead>
     <tbody>${issueRows || '<tr><td colspan="6" class="empty">No other open issues.</td></tr>'}</tbody></table></div>`));

  // ---- failed runs --------------------------------------------------------------------------
  const failRows = D.recent_failures.map(f => `<tr><td>${link(f.url, f.workflow)}</td><td><code>${esc(f.branch)}</code></td>
      <td>${esc(f.event)}</td><td>${f.prs.map(n => link(D.repo_url + "/pull/" + n, "#" + n)).join(", ") || '<span class="muted">none</span>'}</td>
      <td>${esc(fmtDate(f.created_at))}</td></tr>`).join("");
  html.push(section("failures", "Failed workflow runs, last 72 hours", "Each row is a GitHub Actions run that ended in failure. Open it to read the log.",
    `<div class="table-wrap"><table><caption>Failed GitHub Actions runs</caption>
     <thead><tr><th scope="col">Workflow</th><th scope="col">Branch</th><th scope="col">Trigger</th><th scope="col">PR</th><th scope="col">When</th></tr></thead>
     <tbody>${failRows || '<tr><td colspan="5" class="empty">No failed runs in the last 72 hours.</td></tr>'}</tbody></table></div>`));

  // ---- activity heatmap ---------------------------------------------------------------------
  const days = Object.keys(D.activity).sort();
  const maxA = Math.max(1, ...days.map(d => D.activity[d]));
  const level = n => n === 0 ? 0 : Math.min(4, Math.ceil(4 * n / maxA));
  const cols = [];
  const firstDow = days.length ? new Date(days[0] + "T00:00:00Z").getUTCDay() : 0;
  let col = Array(firstDow).fill('<div class="hc pad"></div>');
  days.forEach(d => {
    const n = D.activity[d];
    col.push(`<div class="hc l${level(n)}" title="${d}: ${n}"></div>`);
    if (col.length === 7) { cols.push(`<div class="hm-col">${col.join("")}</div>`); col = []; }
  });
  if (col.length) cols.push(`<div class="hm-col">${col.join("")}</div>`);
  const totalAct = days.reduce((a, d) => a + D.activity[d], 0);
  html.push(section("activity", "Activity, last 90 days", "Commits, merged pull requests and closed issues per day. Hover a square for its count.",
    `<div class="card"><div class="hm" role="img" aria-label="${totalAct} events in the last 90 days">${cols.join("")}</div>
     <div class="legend">Less <span class="hc"></span><span class="hc l1"></span><span class="hc l2"></span><span class="hc l3"></span><span class="hc l4"></span> More</div></div>`));

  // ---- commits by member --------------------------------------------------------------------
  const M = D.members || [];
  const palette = ["#1d6fb0", "#b0471d", "#2f8f5b", "#7a4bb0", "#a8326b", "#4e7d8a", "#8a6d1d", "#5b5f66"];
  const allCommits = M.reduce((a, m) => a + m.commits_total, 0);
  const share = allCommits ? `<div class="share" role="img" aria-label="Share of all commits: ${
      esc(M.map(m => `${m.name} ${Math.round(100 * m.commits_total / allCommits)}%`).join(", "))}">${
      M.filter(m => m.commits_total).map((m, i) => `<span style="width:${100 * m.commits_total / allCommits}%;background:${palette[M.indexOf(m) % palette.length]}"></span>`).join("")}</div>
      <div class="key">${M.map((m, i) => `<span><span class="swatch" style="background:${palette[i % palette.length]}"></span>${esc(m.name)} ${
      Math.round(100 * m.commits_total / allCommits)}%</span>`).join("")}</div>` : "";
  const spark = m => {
    const w = m.weekly, max = Math.max(1, ...w.map(x => x.commits)), bw = 8, gap = 3, h = 28;
    const bars = w.map((x, i) => {
      const bh = Math.round(h * x.commits / max);
      return `<rect x="${i * (bw + gap)}" y="${h - bh}" width="${bw}" height="${bh}"><title>Week of ${x.week}: ${x.commits}</title></rect>`;
    }).join("");
    return `<svg class="spark" width="${w.length * (bw + gap)}" height="${h + 1}" role="img"
      aria-label="Commits per week, last ${w.length} weeks: ${w.map(x => x.commits).join(", ")}">
      <line x1="0" y1="${h + 0.5}" x2="${w.length * (bw + gap)}" y2="${h + 0.5}"></line>${bars}</svg>`;
  };
  const memberRows = M.map(m => {
    const who = m.login ? link(D.repo_url + "/commits?author=" + encodeURIComponent(m.login), m.name) : esc(m.name);
    const flags = [
      !m.linked ? '<span class="status amber">Email not linked to GitHub</span>' : "",
      m.linked && !m.on_roster ? '<span class="status amber">Not on the team roster</span>' : "",
      m.on_roster && m.commits_90d === 0 ? '<span class="status red">No commits in 90 days</span>' : "",
    ].join(" ");
    return `<tr><th scope="row">${who}<div class="small muted">${esc(m.login ? "@" + m.login : "git author name")}${m.role ? " · " + esc(m.role) : ""}</div>${flags}</th>
      <td class="num">${m.commits_total}</td><td class="num">${m.commits_90d}</td>
      <td>${spark(m)}</td>
      <td class="num small"><span style="color:var(--green)">+${m.additions}</span> / <span style="color:var(--red)">-${m.deletions}</span></td>
      <td class="num">${m.prs_opened} / ${m.prs_merged}</td><td class="num">${m.issues_closed}</td>
      <td class="small">${esc(fmtDate(m.last_commit))}</td></tr>`;
  }).join("");
  html.push(section("members", "Commits by member",
    "Commits on the default branch by each teammate. All-time commits and lines changed come from GitHub's " +
    "contributor statistics; the weekly bars cover the last 12 weeks. Work that lives only on an unmerged branch " +
    "does not count yet. Commits are a signal of activity, not a grade on their own.",
    share + `<div class="table-wrap"><table><caption>Contribution by team member</caption>
     <thead><tr><th scope="col">Member</th><th scope="col" class="num">Commits (all)</th><th scope="col" class="num">Commits (90 days)</th>
     <th scope="col">Per week, last 12</th><th scope="col" class="num">Lines added / removed</th>
     <th scope="col" class="num">PRs opened / merged</th><th scope="col" class="num">Assigned issues closed</th><th scope="col">Last commit</th></tr></thead>
     <tbody>${memberRows || '<tr><td colspan="8" class="empty">No commits yet.</td></tr>'}</tbody></table></div>`));

  html.push(`<footer>Generated by <code>scripts/generate_dashboard.py</code> from ${link(D.repo_url, D.repo)}.
    Read the <a href="guide.html">student guide</a> to change layers, members or tests.</footer>`);

  app.innerHTML = html.join("\n");
  app.addEventListener("click", e => {
    const b = e.target.closest("[data-toggle]");
    if (!b) return;
    document.querySelectorAll("#" + b.dataset.toggle + " details").forEach(d => { d.open = b.dataset.open === "1"; });
  });
})();
</script>
</body>
</html>
