<!--
  ossec.conf — Wazuh agent configuration for the SwagPc Café Windows employee PC.
  US-11 (#52), subtask @joromanii: configure Wazuh agents on the Windows PC.

  Deploy this file to  C:\Program Files (x86)\ossec-agent\ossec.conf  on the
  employee workstation, then enroll and start the agent (see README.md).
  It reports to the Wazuh manager at 192.168.20.100 using the same secure
  transport (1514/tcp) and enrollment (1515) the manager config expects.
-->
<ossec_config>

  <!-- ──── Manager connection ──── -->
  <client>
    <server>
      <address>192.168.20.100</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>192.168.20.100</manager_address>
      <port>1515</port>
      <agent_name>swagpc-employee</agent_name>
    </enrollment>
    <crypto_method>aes</crypto_method>
    <notify_time>30</notify_time>
    <time-reconnect>120</time-reconnect>
  </client>

  <!-- ──── Windows event logs (vertical: who logged in, service changes) ──── -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- ──── File Integrity Monitoring on the café order records ──── -->
  <!-- Mirrors the sensitive data the attacker targets during lateral movement. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes">C:\CafeOrders</directories>
    <directories check_all="yes">C:\Users\employee\Documents</directories>
    <ignore>C:\CafeOrders\tmp</ignore>
  </syscheck>

  <!-- ──── Rootcheck / policy monitoring ──── -->
  <rootcheck>
    <disabled>no</disabled>
  </rootcheck>

  <!-- ──── Active response client (manager-driven blocking) ──── -->
  <active-response>
    <disabled>no</disabled>
  </active-response>

</ossec_config>
