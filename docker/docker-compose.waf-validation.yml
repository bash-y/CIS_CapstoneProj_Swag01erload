# Use with docker-compose.yml and project name cafe-waf-validation.
x-probe-image: &probe-image
  image: swagpc-waf-validation:local
  build:
    context: .
    dockerfile: Dockerfile.waf-validation

services:
  firewall:
    <<: *probe-image
    container_name: cafe-validation-firewall
    entrypoint: ["sleep", "infinity"]
  kali:
    <<: *probe-image
    container_name: cafe-validation-kali
  dvwa:
    container_name: cafe-validation-dvwa
    ports: !reset []
  waf:
    container_name: cafe-validation-waf
    ports: !reset []

  business-server:
    <<: *probe-image
    container_name: cafe-validation-business-server
    ports: !reset []
    volumes:
      - ../build/server/www:/srv/business:ro
    entrypoint: ["httpd", "-f", "-p", "80", "-h", "/srv/business"]
  workstation:
    <<: *probe-image
    container_name: cafe-validation-workstation
    entrypoint: ["sleep", "infinity"]

networks:
  guest-net:
    name: cafe-validation-guest
  business-net:
    name: cafe-validation-business
