services:
  # ─────────────────────────────────────────────────────────────────
  # ATTACKER — Guest Network (VLAN 10 / 192.168.10.0/24)
  # ─────────────────────────────────────────────────────────────────
  kali:
    build:
      context: .
      dockerfile: Dockerfile.kali
    image: swagpc-kali:latest
    container_name: swagpc-kali
    hostname: kali-attacker
    tty: true
    stdin_open: true
    cap_add:
      - NET_ADMIN
    networks:
      guest-net:
        ipv4_address: 192.168.10.50
    volumes:
      - ../scripts/attack:/scripts/attack:ro
    # Adds a persistent route to the business subnet via the firewall router
    entrypoint: >
      sh -c "
        ip route add 192.168.20.0/24 via 192.168.10.254 || true &&
        sleep infinity
      "
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # FIREWALL / ROUTER — Dual-Homed (simulates pfSense)
  # ─────────────────────────────────────────────────────────────────
  firewall:
    image: alpine:latest
    container_name: swagpc-firewall
    hostname: swagpc-fw
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ../defense/firewall:/scripts/firewall:ro
    entrypoint: >
      sh -c "
        apk add --no-cache iptables iproute2 tcpdump &&
        iptables -F &&
        iptables -P FORWARD ACCEPT &&
        echo '=== [UNDEFENDED] pfSense Router Active — all forwarding allowed ===' &&
        tail -f /dev/null
      "
    networks:
      guest-net:
        ipv4_address: 192.168.10.254
      business-net:
        ipv4_address: 192.168.20.254
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # DVWA — Café Web App (Business Network / 192.168.20.10)
  # ─────────────────────────────────────────────────────────────────
  dvwa:
    image: vulnerables/web-dvwa
    container_name: swagpc-dvwa
    hostname: swagpc-dvwa
    ports:
      - "127.0.0.1:8080:80"
    networks:
      business-net:
        ipv4_address: 192.168.20.10
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # BUSINESS SERVER — Ubuntu internal operations server (US-4)
  # Business Network / 192.168.20.20. Hosts internal café business
  # services (operations portal + orders export). Distinct from the
  # public-facing, intentionally-vulnerable DVWA web app above.
  # ─────────────────────────────────────────────────────────────────
  business-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.business-server
    image: swagpc-business-server:latest
    container_name: swagpc-business-server
    hostname: swagpc-bizsrv
    ports:
      - "127.0.0.1:8090:80"   # localhost-only inspection of the business portal
    networks:
      business-net:
        ipv4_address: 192.168.20.20
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # WAF — ModSecurity + OWASP CRS reverse proxy in front of DVWA (#23, #7)
  # Business Network / 192.168.20.15. Requests to the café portal go through
  # this WAF, which blocks known attack patterns with 403 and logs each match.
  # DVWA stays on 192.168.20.10 so the undefended baseline is unchanged.
  # ─────────────────────────────────────────────────────────────────
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: swagpc-waf
    hostname: swagpc-waf
    environment:
      - BACKEND=http://dvwa:80
      - BLOCKING_PARANOIA=1
    depends_on:
      - dvwa
    ports:
      - "127.0.0.1:8081:8080"   # localhost-only access to the WAF
    networks:
      business-net:
        ipv4_address: 192.168.20.15
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # EMPLOYEE WORKSTATION — Business Network (192.168.20.25)
  # ─────────────────────────────────────────────────────────────────
  workstation:
    image: alpine:latest
    container_name: swagpc-workstation
    hostname: swagpc-employee
    cap_add:
      - NET_ADMIN
    entrypoint: >
      sh -c "
        apk add --no-cache curl netcat-openbsd &&
        mkdir -p /home/employee/orders &&
        printf 'CustomerID,Name,CreditCardLast4,OrderTotal\n101,John Doe,4321,14.50\n102,Jane Smith,9876,22.75\n103,Bob Lee,1234,8.00\n' > /home/employee/orders/cafe_orders.csv &&
        echo '=== Employee Workstation Ready (simulated café manager PC) ===' &&
        tail -f /dev/null
      "
    networks:
      business-net:
        ipv4_address: 192.168.20.25
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # WAZUH MANAGER — Security Monitoring (Business Network)
  # ─────────────────────────────────────────────────────────────────
  wazuh:
    image: wazuh/wazuh-manager:4.9.2
    container_name: swagpc-wazuh
    hostname: swagpc-wazuh
    environment:
      - WAZUH_MANAGER_NAME=swagpc-wazuh
    volumes:
      - wazuh_data:/var/ossec/data
      - wazuh_logs:/var/ossec/logs
      - ../configs/monitoring/wazuh_ossec.conf:/var/ossec/etc/ossec.conf:ro
    networks:
      business-net:
        ipv4_address: 192.168.20.100
    ports:
      - "127.0.0.1:1514:1514/udp"   # Syslog agent ingestion
      - "127.0.0.1:55000:55000"     # Wazuh API
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # WAZUH DASHBOARD — Kibana UI for SIEM visibility
  # ─────────────────────────────────────────────────────────────────
  dashboard:
    image: wazuh/wazuh-dashboard:4.9.2
    container_name: swagpc-dashboard
    hostname: swagpc-dashboard
    environment:
      - OPENSEARCH_HOSTS=["https://wazuh:9200"]
      - WAZUH_API_URL=https://wazuh
    depends_on:
      - wazuh
    networks:
      business-net:
        ipv4_address: 192.168.20.101
    ports:
      - "127.0.0.1:5601:5601"       # Dashboard UI — http://localhost:5601
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────
  # SURICATA IDS — Network Intrusion Detection on Guest Gateway
  # ─────────────────────────────────────────────────────────────────
  suricata:
    image: jasonish/suricata:latest
    container_name: swagpc-suricata
    hostname: swagpc-suricata
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    network_mode: "container:swagpc-firewall"   # Sniffs same interfaces as the firewall/router
    volumes:
      - suricata_logs:/var/log/suricata
      - ../configs/monitoring/suricata.yaml:/etc/suricata/suricata.yaml:ro
    command: -i eth0 -i eth1 --af-packet
    depends_on:
      - firewall
    restart: unless-stopped

volumes:
  wazuh_data:
  wazuh_logs:
  suricata_logs:

networks:
  guest-net:
    name: guest-net
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1
  business-net:
    name: business-net
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24
          gateway: 192.168.20.1
