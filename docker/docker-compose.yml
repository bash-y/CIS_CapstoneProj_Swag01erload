services:
  # 1. Attacker Container (Guest Network / VLAN 10)
  kali:
    image: kalilinux/kali-rolling
    container_name: swagpc-kali
    command: ["sleep", "infinity"]
    tty: true
    stdin_open: true
    cap_add:
      - NET_ADMIN
    networks:
      guest-net:
        ipv4_address: 192.168.10.50
    restart: unless-stopped

  # 2. Simulated pfSense Firewall & Router (Dual-Homed)
  firewall:
    image: alpine:latest
    container_name: swagpc-firewall
    command: >
      sh -c "
        apk add --no-cache iptables iproute2 tcpdump &&
        sysctl -w net.ipv4.ip_forward=1 &&
        iptables -F &&
        iptables -P FORWARD ACCEPT &&
        echo '=== SwagPc Cafe Firewall Router Active (Undefended Mode) ===' &&
        tail -f /dev/null
      "
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      guest-net:
        ipv4_address: 192.168.10.254
      business-net:
        ipv4_address: 192.168.20.254
    restart: unless-stopped

  # 3. Cafe Web Application (DVWA on Business Network / VLAN 20)
  dvwa:
    image: vulnerables/web-dvwa
    container_name: swagpc-dvwa
    ports:
      - "127.0.0.1:8080:80"
    networks:
      business-net:
        ipv4_address: 192.168.20.10
    restart: unless-stopped

  # 4. Cafe Employee Workstation (Business Network / VLAN 20)
  workstation:
    image: alpine:latest
    container_name: swagpc-workstation
    command: >
      sh -c "
        apk add --no-cache curl python3 netcat-openbsd &&
        mkdir -p /home/employee/orders &&
        echo 'CustomerID,Name,CreditCardLast4,OrderTotal' > /home/employee/orders/cafe_orders.csv &&
        echo '101,John Doe,4321,\$14.50' >> /home/employee/orders/cafe_orders.csv &&
        echo '102,Jane Smith,9876,\$22.75' >> /home/employee/orders/cafe_orders.csv &&
        echo '=== Employee Workstation Ready ===' &&
        tail -f /dev/null
      "
    networks:
      business-net:
        ipv4_address: 192.168.20.25
    restart: unless-stopped

networks:
  guest-net:
    name: guest-net
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1
  business-net:
    name: business-net
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24
          gateway: 192.168.20.1
