name: Build & Deploy Dashboard

# Rebuilds the project dashboard from LIVE GitHub data and deploys it to
# GitHub Pages. Pages is configured as build_type: "workflow", so this
# workflow is what actually publishes the site — without it the dashboard
# never syncs with the real board.

on:
  push:
    branches: [ main ]
    paths:
      - "dashboard/**"
      - "dashboard.config.json"
      - "scripts/generate_dashboard.py"
      - "scripts/dashboard_lib.py"
      - ".github/workflows/dashboard.yml"
  schedule:
    - cron: "0 */6 * * *"   # refresh every 6 hours so counts stay current
  workflow_dispatch: {}      # allow manual "Run workflow"

# Least-privilege token: read repo data, write Pages.
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  pages: write
  id-token: write

# Never run two deploys at once; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build dashboard from live data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate dashboard site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/generate_dashboard.py --out _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
