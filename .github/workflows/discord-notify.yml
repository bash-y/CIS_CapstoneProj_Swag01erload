name: Discord Notifications

# Posts commits, pull requests, reviews, issues and CI failures to the team's
# Discord channel. The webhook lives in the DISCORD_WEBHOOK_URL secret; until it
# is set, every run exits cleanly without posting. Setup: wiki/Discord-Bot.md

on:
  push:
    branches: [ "**" ]
  pull_request:
    types: [ opened, reopened, ready_for_review, review_requested, closed ]
  pull_request_review:
    types: [ submitted ]
  issues:
    types: [ opened, closed, reopened, assigned, milestoned ]
  workflow_run:
    workflows: [ "Verify Commit Issues & Stories", "Build & Deploy Dashboard" ]
    types: [ completed ]

# The notifier only reads the event file; it never needs the GitHub API.
permissions:
  contents: read

jobs:
  notify:
    # CI results are only worth a message when they fail.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always run the notifier from the default branch, so a branch or pull
      # request cannot change the code that receives the webhook secret.
      - name: Checkout notifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts

      - name: Post to Discord
        if: hashFiles('scripts/discord_notify.py') != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 scripts/discord_notify.py event
