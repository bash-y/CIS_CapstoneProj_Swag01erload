name: Skill Security Scan

# US-15 (#122): scan every agent skill (SKILL.md) with SkillSpector. See CONTRIBUTING.md.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  skillspector:
    name: Scan agent skills with SkillSpector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install SkillSpector (pinned release)
        run: |
          uv tool install "git+https://github.com/NVIDIA/SkillSpector.git@v2.13.3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Scan skills (static only, no LLM or API keys)
        run: sh scripts/skill-scan.sh

      - name: Upload SARIF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-scan-sarif
          path: skill-scan-results/
          if-no-files-found: ignore
